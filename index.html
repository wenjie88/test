<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会议汇报计时器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='2' width='60' height='60' rx='14' fill='%230f1622'/%3E%3Ccircle cx='32' cy='32' r='22' fill='%231b2a3c'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0b0f17;
    --bg-soft:#111827;
    --card:#151d2c;
    --line:#243044;
    --txt:#e6edf7;
    --txt-dim:#8b9bb4;
    --normal:#22d3ee;
    --warn:#fbbf24;
    --danger:#ef4444;
    --ok:#34d399;
    --accent:#6366f1;
    --state:var(--normal);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 700px at 50% -10%, #16203a 0%, transparent 60%),
      var(--bg);
    color:var(--txt);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    min-height:100%;
    overflow-x:hidden;
  }
  .app{max-width:1180px;margin:0 auto;padding:22px 22px 40px;display:flex;flex-direction:column;gap:18px}

  /* ---------- 顶部 ---------- */
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--state);box-shadow:0 0 12px var(--state)}
  h1{font-size:19px;font-weight:600;letter-spacing:.5px}
  .sub{font-size:12px;color:var(--txt-dim);margin-top:2px}
  .top-actions{display:flex;gap:8px;flex-wrap:wrap}

  /* ---------- 主舞台 ---------- */
  .stage{
    position:relative;
    background:linear-gradient(180deg,#141c2b,#0f1622);
    border:1px solid var(--line);
    border-radius:22px;
    padding:26px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:430px;
    transition:box-shadow .25s, border-color .25s;
  }
  .stage.flash{animation:flash .5s ease-out 2}
  @keyframes flash{
    0%{box-shadow:0 0 0 0 rgba(251,191,36,0);background:#141c2b}
    35%{box-shadow:0 0 60px 6px var(--flashc,rgba(251,191,36,.55));background:#241f14}
    100%{box-shadow:0 0 0 0 rgba(251,191,36,0);background:#141c2b}
  }
  .ring-wrap{position:relative;width:min(360px,72vw);height:min(360px,72vw)}
  svg.ring{width:100%;height:100%;transform:rotate(-90deg)}
  .ring-bg{fill:none;stroke:#1e293b;stroke-width:14}
  .ring-fg{fill:none;stroke:var(--state);stroke-width:14;stroke-linecap:round;
    transition:stroke .3s}
  .mark{fill:var(--warn);stroke:#0b0f17;stroke-width:2}
  .mark.fired{fill:#64748b}

  .readout{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
  .speaker{font-size:15px;color:var(--txt-dim);max-width:80%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .time{
    font-size:clamp(56px,13vw,104px);
    font-weight:700;
    font-variant-numeric:tabular-nums;
    letter-spacing:2px;
    color:var(--state);
    line-height:1;
    text-shadow:0 0 34px color-mix(in srgb, var(--state) 35%, transparent);
  }
  .time.over{animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .status{font-size:15px;color:var(--txt-dim);min-height:22px;text-align:center}
  .status.strong{color:var(--state);font-weight:600}

  /* ---------- 控制区 ---------- */
  .controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:6px}
  button{
    font-family:inherit;font-size:14px;color:var(--txt);
    background:var(--card);border:1px solid var(--line);
    padding:11px 22px;border-radius:11px;cursor:pointer;
    transition:.16s;white-space:nowrap;
  }
  button:hover{background:#1d2839;border-color:#38496a}
  button:active{transform:translateY(1px)}
  button.primary{background:linear-gradient(135deg,#4f46e5,#6366f1);border-color:#6366f1;font-weight:600;min-width:132px}
  button.primary:hover{filter:brightness(1.12);background:linear-gradient(135deg,#5b52ea,#7075f3)}
  button.ghost{background:transparent}
  button.danger:hover{background:#3a1d22;border-color:#7f2f3a;color:#fca5a5}
  button.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
  .kbd{font-size:11px;color:var(--txt-dim);margin-left:6px;opacity:.75}

  /* ---------- 下半区 ---------- */
  .grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;align-items:start}
  @media(max-width:860px){.grid{grid-template-columns:1fr}}
  .card{background:var(--bg-soft);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
  .card h2{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .card h2 .hint{font-size:11.5px;color:var(--txt-dim);font-weight:400}

  /* 提醒规则 */
  .rules{display:flex;flex-direction:column;gap:8px}
  .rule{display:grid;grid-template-columns:78px 92px 1fr auto;gap:8px;align-items:center}
  .rule-head{display:grid;grid-template-columns:78px 92px 1fr auto;gap:8px;font-size:11.5px;color:var(--txt-dim);padding-bottom:2px}
  .empty{font-size:13px;color:var(--txt-dim);padding:10px 0;text-align:center}

  /* 设置行 */
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed #1e293b}
  .row:last-child{border-bottom:none}
  .row label{font-size:13.5px;color:var(--txt-dim)}
  .row .val{display:flex;align-items:center;gap:8px}
  .row input[type=number]{width:82px;text-align:center}
  .switch{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
  .switch input{display:none}
  .track{width:40px;height:22px;border-radius:99px;background:#33415a;position:relative;transition:.2s}
  .track::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
  .switch input:checked + .track{background:var(--accent)}
  .switch input:checked + .track::after{transform:translateX(18px)}
  input[type=range]{width:120px;padding:0;background:transparent;border:none;accent-color:var(--accent)}

  /* 记录 */
  .log{display:flex;flex-direction:column;gap:6px;max-height:250px;overflow:auto}
  .log-item{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;
    background:#0d1420;border:1px solid var(--line);border-radius:9px;padding:8px 11px}
  .log-item .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .log-item .tm{font-variant-numeric:tabular-nums;color:var(--txt-dim);font-size:12.5px}
  .log-item.over .tm{color:#fca5a5}

  /* 沉浸模式 */
  body.focus header,body.focus .grid{display:none}
  body.focus .app{padding-top:6vh}
  body.focus .stage{min-height:64vh}
  .toast{
    position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
    background:#1f2937;border:1px solid var(--line);padding:11px 18px;border-radius:11px;
    font-size:13.5px;opacity:0;pointer-events:none;transition:.28s;z-index:50;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<canvas id="pipCanvas" width="600" height="200" style="position:fixed;left:-9999px;top:-9999px;pointer-events:none"></canvas>
<video id="pipVideo" muted playsinline style="position:fixed;left:-9999px;top:-9999px;pointer-events:none"></video>

<div class="app">
  <header>
    <div class="brand">
      <span class="dot" id="dot"></span>
      <div>
        <h1>会议汇报计时器</h1>
        <div class="sub">设置汇报时长与提醒节点，可悬浮显示在 PPT 之上</div>
      </div>
      <span id="modeBadge" style="font-size:12px;color:var(--txt-dim);white-space:nowrap">检测中…</span>
    </div>
    <div class="top-actions">
      <button class="ghost sm" id="btnPip" style="display:none">画中画悬浮<span class="kbd">P</span></button>
      <button class="ghost sm" id="btnMini">悬浮窗<span class="kbd">M</span></button>
      <button class="ghost sm" id="btnFocus">沉浸模式<span class="kbd">H</span></button>
      <button class="ghost sm" id="btnFull">全屏<span class="kbd">F</span></button>
    </div>
  </header>

  <section class="stage" id="stage">
    <div class="ring-wrap">
      <svg class="ring" viewBox="0 0 300 300">
        <circle class="ring-bg" cx="150" cy="150" r="128"></circle>
        <circle class="ring-fg" id="ringFg" cx="150" cy="150" r="128"></circle>
        <g id="marks"></g>
      </svg>
      <div class="readout">
        <div class="speaker" id="speakerLabel">—</div>
        <div class="time" id="timeLabel">00:00</div>
        <div class="status" id="statusLabel">准备就绪</div>
      </div>
    </div>
    <div class="controls">
      <button class="primary" id="btnStart">开始汇报<span class="kbd">空格</span></button>
      <button id="btnReset">重置<span class="kbd">R</span></button>
      <button id="btnDone">汇报完成</button>
    </div>
  </section>

  <div class="grid">
    <!-- 提醒规则 -->
    <div class="card">
      <h2>提醒规则 <span class="hint">到点响铃 + 窗口闪烁</span></h2>
      <div class="rule-head">
        <span>类型</span><span>时间</span><span>提示语（可选）</span><span></span>
      </div>
      <div class="rules" id="rules"></div>
      <div style="margin-top:12px;display:flex;gap:8px">
        <button class="sm" id="btnAdd">+ 添加提醒</button>
        <button class="sm danger" id="btnClearRules">清空</button>
      </div>
    </div>

    <!-- 设置 -->
    <div class="card">
      <h2>计时设置</h2>
      <div class="row">
        <label>汇报时长（分）</label>
        <div class="val"><input type="number" id="cfgMin" min="0" max="180" step="1"></div>
      </div>
      <div class="row">
        <label>汇报时长（秒）</label>
        <div class="val"><input type="number" id="cfgSec" min="0" max="59" step="5"></div>
      </div>
      <div class="row">
        <label>快捷时长</label>
        <div class="val" id="presets" style="gap:6px">
          <button class="sm" data-p="3">3 分</button>
          <button class="sm" data-p="5">5 分</button>
          <button class="sm" data-p="8">8 分</button>
          <button class="sm" data-p="10">10 分</button>
          <button class="sm" data-p="15">15 分</button>
        </div>
      </div>
      <div class="row">
        <label>超时后循环提醒</label>
        <label class="switch"><input type="checkbox" id="cfgLoop"><span class="track"></span></label>
      </div>
      <div class="row">
        <label>循环提醒间隔（秒）</label>
        <div class="val"><input type="number" id="cfgLoopSec" min="5" max="300" step="5"></div>
      </div>
      <div class="row">
        <label>提示音</label>
        <label class="switch"><input type="checkbox" id="cfgSound"><span class="track"></span></label>
      </div>
      <div class="row">
        <label>汇报人姓名</label>
        <div class="val"><input type="text" id="cfgName" placeholder="输入姓名" style="width:120px"></div>
      </div>
      <div class="row">
        <label>悬浮窗不透明度</label>
        <div class="val"><input type="range" id="cfgAlpha" min="35" max="100" step="5"></div>
      </div>
    </div>

    <!-- 记录 -->
    <div class="card" style="grid-column:1/-1">
      <h2>汇报记录 <span class="hint">按实际用时记录，超时标红</span></h2>
      <div class="log" id="log"><div class="empty">暂无记录，点击「汇报完成」保存</div></div>
      <div style="margin-top:10px"><button class="sm danger" id="btnClearLog">清空记录</button></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";
  const $ = id => document.getElementById(id);
  const R = 128, C = 2 * Math.PI * R;

  // ---------- 模式与共享状态 ----------
  // mode: "backend"=连 Python 引擎；"local"=浏览器内置引擎
  let mode = "local";
  let state = null;            // 后端 snapshot 或 本地 snapshot
  let cfg = null;
  let history = [];
  let firstSync = true;
  const firedRules = new Set();
  let lastLoopAlertAt = 0;
  let lastElapsed = 0;
  let pollTimer = null, rafTimer = null;

  // ---------- 本地引擎（独立模式） ----------
  const localEngine = (() => {
    const LS_KEY = "pt-store-v3";
    let store = {};
    try { store = JSON.parse(localStorage.getItem(LS_KEY) || "{}") || {}; } catch(e){ store = {}; }

    let running = false, started = false;
    let acc = 0, seg = 0;                       // 单位：秒
    let cfg = Object.assign({
      minutes: 5, seconds: 0, speaker: "",
      rules: [
        { mode:"left", value:60, note:"还剩 1 分钟" },
        { mode:"left", value:30, note:"还剩 30 秒" },
        { mode:"at",   value:0,  note:"" }
      ],
      loop: true, loopSec: 30, sound: true
    }, store.cfg || {});
    if (!Array.isArray(cfg.rules)) cfg.rules = [];
    let history = Array.isArray(store.history) ? store.history.slice(0, 50) : [];

    function writeStore(){
      try { localStorage.setItem(LS_KEY, JSON.stringify({cfg, history})); } catch(e){}
    }
    function live(){ return running ? acc + (performance.now() - seg) / 1000 : acc; }
    function total(){ return (cfg.minutes||0) * 60 + (cfg.seconds||0); }
    function snapshot(){
      const t = live(), tot = total(), rem = tot - t;
      return {
        running, started,
        elapsed: t, total: tot, remain: rem, over: rem <= 0,
        speaker: cfg.speaker || "",
        cfg: Object.assign({}, cfg, { rules: cfg.rules.map(r => Object.assign({}, r)) }),
        history: history.slice()
      };
    }
    function start(){
      if (!started) { started = true; }
      if (!running) { running = true; seg = performance.now(); }
      writeStore();
    }
    function pause(){
      if (running) { acc += (performance.now() - seg) / 1000; running = false; }
      writeStore();
    }
    function reset(save){
      if (started && save){
        const t = live(), tot = total();
        history.unshift({
          name: cfg.speaker || "未命名",
          actual: t, planned: tot, over: t > tot,
          ts: new Date().toLocaleTimeString("zh-CN", { hour12: false })
        });
        history = history.slice(0, 50);
      }
      running = false; started = false; acc = 0; seg = 0;
      writeStore();
    }
    function setCfg(c){
      if (!c) return;
      if (c.minutes != null) cfg.minutes = Math.max(0, +c.minutes || 0);
      if (c.seconds != null) cfg.seconds = Math.max(0, Math.min(59, +c.seconds || 0));
      if (c.speaker != null) cfg.speaker = String(c.speaker);
      if (c.loop    != null) cfg.loop = !!c.loop;
      if (c.loopSec != null) cfg.loopSec = Math.max(5, +c.loopSec || 30);
      if (c.sound   != null) cfg.sound = !!c.sound;
      if (Array.isArray(c.rules)) cfg.rules = c.rules.map(r => Object.assign({}, r));
      writeStore();
    }
    function clearHist(){ history = []; writeStore(); }
    function removeHist(idx){ history.splice(idx, 1); writeStore(); }
    function cmd(op, extra){
      if (op === "start") start();
      else if (op === "pause") pause();
      else if (op === "reset") reset(true);
      else if (op === "set_cfg") setCfg(extra && extra.cfg || {});
      else if (op === "history_clear") clearHist();
      else if (op === "history_remove") removeHist(extra && extra.idx);
    }
    return { snapshot, cmd };
  })();

  // ---------- 后端通信 ----------
  async function backendState(){
    const r = await fetch("/api/state", { cache: "no-store" });
    if (!r.ok) throw new Error("bad");
    return await r.json();
  }
  async function backendCmd(op, extra){
    const r = await fetch("/api/cmd", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({ op: op }, extra || {}))
    });
    if (!r.ok) throw new Error("bad");
    return await r.json();
  }

  // ---------- 模式选择 ----------
  async function detect(){
    let s = null;
    try { s = await backendState(); } catch(e){}
    if (s && typeof s.elapsed === "number") {
      mode = "backend";
      applyState(s);
      startBackendLoop();
      setModeBadge("● 已连接桌面端（含悬浮窗）", "var(--ok)");
      $("btnMini").style.display = "";
      $("btnPip").style.display = "none";
    } else {
      mode = "local";
      applyState(localEngine.snapshot());
      startLocalLoop();
      setModeBadge("● 独立网页模式（点 P 开启画中画悬浮）", "var(--warn)");
      $("btnMini").style.display = "none";
      $("btnPip").style.display = "";
      updatePipBtn();
    }
  }

  function startBackendLoop(){
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(async () => {
      if (mode !== "backend") return;
      try {
        const s = await backendState();
        if (s) applyState(s);
      } catch(e){}
    }, 180);
  }
  // 双驱动：rAF 负责前台顺滑渲染，setInterval 负责后台/最小化时兜底
  // （elapsed 由 performance.now() 差值算出，Even 即使被节流也不丢时间）
  function startLocalLoop(){
    if (pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(() => {
      if (mode === "local") applyState(localEngine.snapshot());
    }, 220);
    const step = () => {
      if (mode !== "local") return;
      applyState(localEngine.snapshot());
      rafTimer = requestAnimationFrame(step);
    };
    rafTimer = requestAnimationFrame(step);
  }

  async function sendCmd(op, extra){
    if (mode === "backend") {
      try {
        const j = await backendCmd(op, extra);
        if (j && j.state) applyState(j.state);
      } catch(e){}
    } else {
      localEngine.cmd(op, extra);
      applyState(localEngine.snapshot());
    }
  }

  function setModeBadge(text, color){
    const el = $("modeBadge");
    if (!el) return;
    el.textContent = text;
    el.style.color = color;
  }

  function applyState(s){
    if (!s) return;
    state = s;
    cfg = s.cfg || {};
    history = s.history || [];
    if (firstSync){
      firstSync = false;
      bindInputs();
    }
    detectRules();
    render();
  }

  // ---------- 提示音 ----------
  let actx = null;
  function audio(){
    if (!actx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
    }
    if (actx.state === "suspended") actx.resume();
    return actx;
  }
  function tone(freq, dur, when, vol){
    const ctx = audio(); if (!ctx) return;
    const t0 = ctx.currentTime + (when || 0);
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(t0); osc.stop(t0 + dur + 0.05);
  }
  function playRemind(){
    if (!cfg || !cfg.sound) return;
    tone(880, 0.12, 0, 0.4);
    tone(880, 0.12, 0.18, 0.4);
  }
  function playAlert(){
    if (!cfg || !cfg.sound) return;
    tone(660, 0.22, 0, 0.55);
    tone(660, 0.22, 0.28, 0.55);
    tone(880, 0.34, 0.56, 0.55);
  }

  // ---------- 工具 ----------
  function fmt(ms){
    const s = Math.ceil(Math.abs(ms) / 1000);
    return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
  }
  function parseTime(str){
    str = String(str || "").trim();
    if (!str) return 0;
    if (str.indexOf(":") > -1){
      const p = str.split(":");
      return (parseInt(p[0], 10) || 0) * 60 + (parseInt(p[1], 10) || 0);
    }
    return parseInt(str, 10) || 0;
  }
  function ruleKey(r, i){ return i + "|" + r.mode + "|" + r.value; }
  function totalSec(){ return (cfg.minutes||0) * 60 + (cfg.seconds||0); }

  function toast(msg){
    const t = $("toast");
    if (!t) return;
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(t._h);
    t._h = setTimeout(() => t.classList.remove("show"), 1800);
  }
  function flash(rgba){
    const stage = $("stage");
    if (!stage) return;
    document.documentElement.style.setProperty("--flashc", rgba);
    stage.classList.remove("flash");
    void stage.offsetWidth;
    stage.classList.add("flash");
    setTimeout(() => stage.classList.remove("flash"), 1200);
  }

  // ---------- 规则触发 ----------
  function detectRules(){
    if (!cfg || !state) return;
    const elapsed = state.elapsed;
    const remain = state.remain;
    const tot = state.total;
    if (tot <= 0 && (!cfg.rules || cfg.rules.length === 0)) return;

    (cfg.rules || []).forEach((r, i) => {
      const key = ruleKey(r, i);
      let should = false;
      if (r.mode === "left"){
        if (remain <= r.value && remain > r.value - 0.6) should = true;
      } else if (r.mode === "at"){
        if (elapsed >= r.value && elapsed < r.value + 0.6) should = true;
      }
      if (should && !firedRules.has(key)){
        firedRules.add(key);
        playRemind();
        const txt = r.note || (r.mode === "left" ? "剩余 " + fmt(r.value*1000) : "已用时 " + fmt(r.value*1000));
        toast("⏰ " + txt);
        flash("rgba(251,191,36,.55)");
      }
    });

    if (!firedRules.has("__over__") && state.over && state.running){
      firedRules.add("__over__");
      playAlert();
      toast("时间到！请收尾");
      flash("rgba(239,68,68,.65)");
    }
    if (cfg.loop && state.over && state.running){
      const interval = (cfg.loopSec || 30) * 1000;
      const now = Date.now();
      if (now - lastLoopAlertAt > interval){
        lastLoopAlertAt = now;
        playAlert();
        toast("已超时 " + fmt((state.elapsed - state.total) * 1000));
      }
    }

    if (state.elapsed < lastElapsed - 0.5){
      firedRules.clear();
      firedRules.delete("__over__");
      lastLoopAlertAt = 0;
    }
    lastElapsed = state.elapsed;
  }

  // ---------- 渲染 ----------
  const ringFg = $("ringFg");
  ringFg.style.strokeDasharray = C;

  function render(){
    if (!state || !cfg) return;
    const elapsed = state.elapsed;
    const remain = state.remain;
    const total = state.total;

    let color;
    if (remain < 0) color = "var(--danger)";
    else if (remain < 10) color = "#ff7a45";
    else if (remain < 30) color = "var(--warn)";
    else color = "var(--normal)";
    document.documentElement.style.setProperty("--state", color);
    ringFg.style.stroke = color;
    const dot = $("dot"); if (dot) dot.style.background = color;

    const tl = $("timeLabel");
    tl.textContent = (remain >= 0 ? "" : "-") + fmt(Math.abs(remain) * 1000);
    tl.classList.toggle("over", remain <= 0);

    const ratio = total > 0 ? Math.min(1, elapsed / total) : 0;
    ringFg.style.strokeDashoffset = C * (1 - ratio);

    let st;
    if (!state.started) st = "准备就绪";
    else if (state.running) st = state.over ? "已超时 · 请尽快结束" : "汇报中 · 加油";
    else st = "已暂停";
    const sl = $("statusLabel");
    sl.textContent = st;
    sl.classList.toggle("strong", state.running && !state.over);

    $("speakerLabel").textContent = cfg.speaker || "未命名汇报人";

    const bs = $("btnStart");
    bs.innerHTML = (state.running ? "暂停" : (state.started ? "继续" : "开始汇报")) +
        '<span class="kbd">空格</span>';

    setValIfBlur($("cfgMin"),   cfg.minutes  != null ? cfg.minutes  : 0);
    setValIfBlur($("cfgSec"),   cfg.seconds  != null ? cfg.seconds  : 0);
    setValIfBlur($("cfgLoopSec"), cfg.loopSec != null ? cfg.loopSec : 30);
    setValIfBlur($("cfgName"),  cfg.speaker || "");
    $("cfgLoop").checked = !!cfg.loop;
    $("cfgSound").checked = !!cfg.sound;

    renderMarks();
    renderLog();
    if (pipActive) drawPip();
  }
  function setValIfBlur(el, v){ if (el && document.activeElement !== el) el.value = v; }

  function renderMarks(){
    const g = $("marks"); if (!g || !cfg) return;
    g.innerHTML = "";
    const tot = totalSec();
    if (tot <= 0) return;
    (cfg.rules || []).forEach((r, i) => {
      let at = r.mode === "left" ? Math.max(0, tot - r.value) : r.value;
      if (at <= 0 || at > tot) return;
      const ang = (at / tot) * 2 * Math.PI;
      const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      c.setAttribute("cx", (150 + R * Math.cos(ang)).toFixed(2));
      c.setAttribute("cy", (150 + R * Math.sin(ang)).toFixed(2));
      c.setAttribute("r", 6);
      c.setAttribute("class", "mark" + (firedRules.has(ruleKey(r,i)) ? " fired" : ""));
      g.appendChild(c);
    });
  }

  function renderRules(){
    const box = $("rules"); if (!box || !cfg) return;
    box.innerHTML = "";
    if (!cfg.rules || !cfg.rules.length){
      box.innerHTML = '<div class="empty">还没有提醒规则，点「+ 添加提醒」</div>';
      return;
    }
    cfg.rules.forEach((r, i) => {
      const row = document.createElement("div");
      row.className = "rule";

      const sel = document.createElement("select");
      [["left","剩余"],["at","已用"]].forEach(([v,t])=>{
        const o = document.createElement("option");
        o.value = v; o.textContent = t;
        if (r.mode === v) o.selected = true;
        sel.appendChild(o);
      });
      sel.addEventListener("change", ()=>{
        r.mode = sel.value;
        pushCfg();
        renderMarks();
      });

      const inp = document.createElement("input");
      inp.type = "text";
      inp.value = fmt(r.value * 1000);
      inp.title = "支持 mm:ss 或纯秒数";
      inp.addEventListener("change", ()=>{
        r.value = Math.max(0, parseTime(inp.value));
        inp.value = fmt(r.value * 1000);
        pushCfg();
        renderMarks();
      });

      const note = document.createElement("input");
      note.type = "text";
      note.placeholder = "提示语（可选）";
      note.value = r.note || "";
      note.addEventListener("change", ()=>{ r.note = note.value; pushCfg(); });

      const del = document.createElement("button");
      del.className = "sm danger";
      del.textContent = "删除";
      del.addEventListener("click", ()=>{
        cfg.rules.splice(i, 1);
        pushCfg();
        renderRules();
        renderMarks();
      });

      row.appendChild(sel); row.appendChild(inp); row.appendChild(note); row.appendChild(del);
      box.appendChild(row);
    });
    renderMarks();
  }

  function renderLog(){
    const box = $("log"); if (!box) return;
    box.innerHTML = "";
    if (!history || !history.length){
      box.innerHTML = '<div class="empty">暂无记录，点击「汇报完成」保存</div>';
      return;
    }
    history.forEach((h, idx) => {
      const item = document.createElement("div");
      item.className = "log-item" + (h.over ? " over" : "");
      const left = document.createElement("div");
      left.style.minWidth = "0";
      left.style.flex = "1";
      const nm = document.createElement("div");
      nm.className = "nm"; nm.textContent = h.name;
      const meta = document.createElement("div");
      meta.className = "tm";
      const used = fmt(h.actual * 1000);
      const plan = fmt(h.planned * 1000);
      meta.textContent = h.over
        ? `${used} / 计划 ${plan} · 超时`
        : `${used} / 计划 ${plan} · ${h.ts}`;
      left.appendChild(nm); left.appendChild(meta);

      const del = document.createElement("button");
      del.className = "sm danger";
      del.textContent = "删除";
      del.addEventListener("click", ()=> sendCmd("history_remove", {idx: idx}));

      item.appendChild(left);
      item.appendChild(del);
      box.appendChild(item);
    });
  }

  // ---------- 输入绑定 ----------
  function bindInputs(){
    if (!cfg) return;
    $("cfgMin").addEventListener("change", ()=>{
      cfg.minutes = Math.max(0, parseInt($("cfgMin").value, 10) || 0);
      pushCfg();
    });
    $("cfgSec").addEventListener("change", ()=>{
      cfg.seconds = Math.max(0, Math.min(59, parseInt($("cfgSec").value, 10) || 0));
      pushCfg();
    });
    $("cfgLoop").addEventListener("change", ()=>{
      cfg.loop = $("cfgLoop").checked; pushCfg();
    });
    $("cfgLoopSec").addEventListener("change", ()=>{
      cfg.loopSec = Math.max(5, parseInt($("cfgLoopSec").value, 10) || 30);
      pushCfg();
    });
    $("cfgSound").addEventListener("change", ()=>{
      cfg.sound = $("cfgSound").checked; pushCfg();
    });
    $("cfgName").addEventListener("change", ()=>{
      cfg.speaker = $("cfgName").value; pushCfg();
    });
    document.querySelectorAll("#presets button").forEach(b => {
      b.addEventListener("click", ()=>{
        cfg.minutes = parseInt(b.dataset.p, 10) || 0;
        cfg.seconds = 0;
        pushCfg();
      });
    });

    $("btnAdd").addEventListener("click", ()=>{
      cfg.rules = cfg.rules || [];
      cfg.rules.push({mode: "left", value: 30, note: ""});
      pushCfg();
      renderRules();
    });
    $("btnClearRules").addEventListener("click", ()=>{
      if (!confirm("清空所有提醒规则？")) return;
      cfg.rules = [];
      pushCfg();
      renderRules();
    });

    $("btnStart").addEventListener("click", ()=>{
      sendCmd(state && state.running ? "pause" : "start");
    });
    $("btnReset").addEventListener("click", ()=>{
      if (confirm("重置当前计时？")) sendCmd("reset");
    });
    $("btnDone").addEventListener("click", ()=>{
      if (confirm("结束当前汇报并保存记录？")) sendCmd("reset");
    });
    $("btnClearLog").addEventListener("click", ()=>{
      if (confirm("清空所有汇报记录？")) sendCmd("history_clear");
    });
    $("btnMini").addEventListener("click", ()=> sendCmd("overlay_toggle"));
    $("btnPip").addEventListener("click", ()=> togglePip());
    $("btnFocus").addEventListener("click", ()=> document.body.classList.toggle("focus"));
    $("btnFull").addEventListener("click", ()=>{
      if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
      else document.exitFullscreen?.();
    });

    document.addEventListener("keydown", e => {
      const t = e.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "SELECT")) return;
      if (e.code === "Space"){ e.preventDefault(); sendCmd(state && state.running ? "pause" : "start"); }
      else if (e.code === "KeyR"){ if (confirm("重置？")) sendCmd("reset"); }
      else if (e.code === "KeyF"){
        if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
        else document.exitFullscreen?.();
      }
      else if (e.code === "KeyH"){ document.body.classList.toggle("focus"); }
      else if (e.code === "KeyM"){ sendCmd("overlay_toggle"); }
      else if (e.code === "KeyP"){ togglePip(); }
    });
  }

  function pushCfg(){
    sendCmd("set_cfg", {cfg: cfg});
  }

  // ---------- 画中画悬浮（独立网页模式用） ----------
  const pipCanvas = $("pipCanvas");
  const pipVideo = $("pipVideo");
  let pipStream = null;
  let pipActive = false;
  let pipDrawTimer = null;

  async function togglePip(){
    if (!("pictureInPictureEnabled" in document)){
      alert("当前浏览器不支持画中画 API，请用 Chrome 或 Edge 打开");
      return;
    }
    if (!document.pictureInPictureEnabled){
      alert("浏览器画中画被禁用，请在地址栏右侧图标中开启");
      return;
    }
    if (pipActive){
      try { await document.exitPictureInPicture(); } catch(e){}
      return;
    }
    drawPip();
    pipStream = pipCanvas.captureStream(30);
    pipVideo.srcObject = pipStream;
    pipVideo.muted = true;
    try {
      await pipVideo.play();
      await pipVideo.requestPictureInPicture();
      pipActive = true;
      updatePipBtn();
      // PiP 开启后保持每 250ms 重绘，兜底刷新
      if (pipDrawTimer) clearInterval(pipDrawTimer);
      pipDrawTimer = setInterval(()=> { if (pipActive) drawPip(); }, 250);
    } catch(e){
      alert("画中画启动失败：" + (e.message || e));
      if (pipStream){ pipStream.getTracks().forEach(t=>t.stop()); pipStream = null; }
      pipVideo.srcObject = null;
    }
  }

  function updatePipBtn(){
    const btn = $("btnPip");
    if (!btn) return;
    btn.innerHTML = (pipActive ? "退出画中画" : "画中画悬浮") + '<span class="kbd">P</span>';
    btn.style.background = pipActive ? "var(--ok)" : "";
    btn.style.color = pipActive ? "#0b0e1a" : "";
  }

  pipVideo.addEventListener("leavepictureinpicture", ()=>{
    pipActive = false;
    if (pipDrawTimer){ clearInterval(pipDrawTimer); pipDrawTimer = null; }
    if (pipStream){ pipStream.getTracks().forEach(t=>t.stop()); pipStream = null; }
    pipVideo.srcObject = null;
    updatePipBtn();
  });

  function pipRoundRect(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function drawPip(){
    if (!pipCanvas) return;
    const ctx = pipCanvas.getContext("2d");
    const w = pipCanvas.width, h = pipCanvas.height;

    let color = "#5eead4";      // 默认青绿
    let stTxt = "加油";
    let timeTxt = "--:--";
    let speaker = cfg && cfg.speaker ? cfg.speaker : "";
    let over = false;
    let paused = false;
    let started = false;

    if (state && cfg){
      const remain = state.remain || 0;
      const total = state.total || 0;
      started = !!state.started;
      speaker = cfg.speaker || "未命名汇报人";
      timeTxt = (remain >= 0 ? "" : "-") + fmt(Math.abs(remain) * 1000);
      if (total > 0){
        // 根据剩余比例配色
        if (!started){ color = "#5eead4"; stTxt = "准备就绪"; }
        else if (state.over){ color = "#ef4444"; stTxt = "已超时 · 请尽快结束"; over = true; }
        else if (!state.running){ color = "#9ca3af"; stTxt = "已暂停"; paused = true; }
        else {
          if (remain < 10) color = "#ff7a45";
          else if (remain < 30) color = "#fbbf24";
          else color = "#5eead4";
          stTxt = "汇报中";
        }
      }
    }

    // 背景
    ctx.clearRect(0, 0, w, h);
    pipRoundRect(ctx, 0, 0, w, h, 24);
    const bgGrad = ctx.createLinearGradient(0, 0, w, h);
    bgGrad.addColorStop(0, "rgba(15, 18, 30, 0.96)");
    bgGrad.addColorStop(1, "rgba(20, 24, 40, 0.96)");
    ctx.fillStyle = bgGrad;
    ctx.fill();

    // 外边框（状态色）
    ctx.strokeStyle = color;
    ctx.lineWidth = 4;
    pipRoundRect(ctx, 2, 2, w - 4, h - 4, 22);
    ctx.stroke();

    // 左侧色条
    ctx.fillStyle = color;
    pipRoundRect(ctx, 16, 16, 14, h - 32, 7);
    ctx.fill();

    // 倒计时大字
    ctx.fillStyle = over ? "#ef4444" : "#ffffff";
    ctx.font = "bold 110px 'Consolas', 'JetBrains Mono', monospace";
    ctx.textBaseline = "middle";
    ctx.textAlign = "left";
    ctx.fillText(timeTxt, 56, h / 2 + 4);

    // 汇报人（右上）
    ctx.fillStyle = "#cbd5e1";
    ctx.font = "600 30px 'Microsoft YaHei', sans-serif";
    ctx.textAlign = "right";
    ctx.fillText(speaker.length > 14 ? speaker.slice(0, 13) + "…" : speaker, w - 28, 56);

    // 状态文字（右下）
    ctx.fillStyle = color;
    ctx.font = "bold 30px 'Microsoft YaHei', sans-serif";
    ctx.fillText(stTxt, w - 28, h - 56);

    // 超时叠加红雾
    if (over){
      ctx.fillStyle = "rgba(239, 68, 68, 0.10)";
      pipRoundRect(ctx, 0, 0, w, h, 24);
      ctx.fill();
    }
    // 暂停半透明蒙层
    if (paused){
      ctx.fillStyle = "rgba(0, 0, 0, 0.30)";
      pipRoundRect(ctx, 0, 0, w, h, 24);
      ctx.fill();
    }
  }

  // ---------- 启动 ----------
  detect();
  // 首次渲染规则（用 cfg，可能暂时为空）
  setTimeout(renderRules, 50);
})();
</script>

</body>
</html>
